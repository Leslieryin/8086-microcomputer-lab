name: CI

on:
  push:
  pull_request:

jobs:
  assemble:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 定位 MASM 并汇编全部 .asm
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe 不存在，无法定位 Visual Studio" }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "未找到带 C++ x86/x64 工具集的 Visual Studio" }

          $ml = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x86\ml.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $ml) { throw "未找到 ml.exe（MASM）" }
          Write-Host "使用 MASM: $($ml.FullName)"

          $files = @(Get-ChildItem -Recurse -Filter *.asm)
          if ($files.Count -eq 0) { throw "仓库里没有找到 .asm 文件" }

          $failed = 0
          foreach ($file in $files) {
            $obj = Join-Path $env:RUNNER_TEMP ($file.BaseName + ".obj")
            & $ml.FullName /c /omf /nologo /Fo"$obj" "$($file.FullName)"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$($file.FullName)::MASM 汇编失败"
              $failed++
            } else {
              Write-Host "OK  $($file.Name)"
            }
          }

          if ($failed -gt 0) { throw "$failed 个源文件汇编失败" }
